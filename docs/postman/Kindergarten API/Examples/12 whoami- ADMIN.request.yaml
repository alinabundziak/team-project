$kind: http-request
name: "12 whoami: ADMIN"
url: "{{baseUrl}}/_examples/whoami"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: "pm.test('Статус 200', () => pm.response.to.have.status(200));\r

      pm.test('Роль ADMIN', () => pm.expect(pm.response.json().role).to.eql('ADMIN'));"
    language: text/javascript
order: 3000
