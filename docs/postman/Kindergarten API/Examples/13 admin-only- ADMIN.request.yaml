$kind: http-request
name: "13 admin-only: ADMIN"
url: "{{baseUrl}}/_examples/admin-only"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
