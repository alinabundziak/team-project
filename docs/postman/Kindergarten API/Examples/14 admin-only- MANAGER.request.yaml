$kind: http-request
name: "14 admin-only: MANAGER"
url: "{{baseUrl}}/_examples/admin-only"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
