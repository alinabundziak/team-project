$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"admin.test@example.com\",\r

    \  \"password\": \"Test12345!\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test('Статус 200', () => pm.response.to.have.status(200));\r

      \r

      const body = pm.response.json();\r

      \r

      pm.test('Є token', () => pm.expect(body.token).to.be.a('string'));\r

      pm.test('Хеш пароля не віддається', () => {\r

      \  pm.expect(JSON.stringify(body)).to.not.include('password');\r

      });\r

      \r

      pm.collectionVariables.set('adminToken', body.token);"
    language: text/javascript
order: 1000
